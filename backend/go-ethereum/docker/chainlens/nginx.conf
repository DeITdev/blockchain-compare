events { }

http {
  # Chrome may send large Cookie headers (e.g. shared localhost cookies from Besu :8081).
  client_header_buffer_size 16k;
  large_client_header_buffers 4 32k;

  server {
    listen 80;
    charset utf-8;

    location /api/ {
      proxy_pass http://chainlens-api:8090/;
      proxy_http_version 1.1;
      proxy_set_header Host chainlens-api:8090;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      proxy_pass http://chainlens-web:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host chainlens-web:3000;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /5xx.html;
    location /5xx.html {
      root /www/error_pages/;
    }
  }
}
